services:
  backend:
    image: ghcr.io/andyg-0/tilora-backend:${TILORA_VERSION:-latest}
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/storage.db
      - ICLOUD_SESSION_DIR=/app/data/icloud_session
      # Same reasoning as ICLOUD_SESSION_DIR above: without this, the
      # secret-encryption key (backend/app/crypto.py) defaults to
      # /app/secret.key, which isn't backed by the volume below — every
      # container recreation would generate a fresh key and strand every
      # encrypted secret written under the old one.
      - SECRET_KEY_PATH=/app/data/secret.key
      # Same reasoning again: without this, generated HDHomeRun caption/
      # thumbnail cache files (backend/app/plugins/hdhomerun/media_cache.py)
      # default to /app/hdhomerun_media_cache, outside the volume below —
      # every container recreation would re-pay the ffmpeg/ffprobe cost for
      # every previously-cached recording.
      - HDHOMERUN_MEDIA_CACHE_DIR=/app/data/hdhomerun_media_cache
      # Must match wherever the *browser* actually loads the frontend from —
      # this compose file serves it on port 3000, not the backend's own
      # 5173 default (that's the local Vite dev server's port). Overriding
      # here (rather than relying on backend/.env) means it's always correct
      # for this deployment out of the box; override again if
      # PUBLIC_API_BASE_URL below is also pointed at a non-default host.
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      # A directory mount (not a single-file mount on dashboard.yaml) —
      # ./backend/config is tracked in git and always exists, so a missing
      # dashboard.yaml on the host just becomes a normal missing file inside
      # an always-present directory, instead of Docker silently creating an
      # empty directory at the mount point (see docker-entrypoint.sh, which
      # copies the example file into place when that happens).
      - ./backend/config:/app/config
      - ./backend/.env:/app/.env
      - backend-storage:/app/data
      # Uncomment to enable the Container widget's Docker mode
      # (backend/app/plugins/container) against a direct socket mount.
      # Caveat: this socket is normally root:docker-owned, so the backend
      # (which runs as a non-root user, see backend/Dockerfile) needs
      # either root or docker-group membership (`group_add:` below) to
      # read it — and per Docker's own docs, docker-group access is
      # root-equivalent on the host, not a real privilege reduction. For a
      # non-privileged setup instead, see the `socket-proxy` service below
      # (recommended) or use rootless Podman (next line).
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # Same, for Podman — path shown is rootful Podman's default (same
      # root-equivalence caveat as above). Rootless Podman avoids this
      # entirely: its socket at $XDG_RUNTIME_DIR/podman/podman.sock
      # (commonly /run/user/<uid>/podman/podman.sock) is owned by the
      # invoking user, not root, so no group/root access is needed.
      # - /run/podman/podman.sock:/run/podman/podman.sock:ro
      # Uncomment and point at a folder of images on the host to back the
      # Photos widget's "local" provider — set that same container-side path
      # as the widget's `directory` setting.
      # - /path/to/photos:/app/photos:ro
    # Uncomment to enable the HDHomeRun widget's "qsv"/"vaapi" hwaccel
    # presets (app/transcoding.py) — the image bundles the VA-API/QSV
    # driver packages (see backend/Dockerfile), but a container has no
    # access to host devices unless one is explicitly passed through, and
    # not every host even has a GPU render node (e.g. this repo's own
    # macOS/podman-machine testing has none) — mapping a device that
    # doesn't exist fails container creation outright, so this can't be
    # on by default.
    # devices:
    #   - /dev/dri:/dev/dri
    # The backend runs as a fixed non-root user (uid/gid 1000 "tilora", see
    # Dockerfile) with no supplementary groups, but /dev/dri/renderD128 is
    # normally owned by the host's "render" group at mode 660 — without
    # group_add, opening it fails with a permission error even with the
    # device mapped above. Find the real GID with `getent group render` on
    # the host (it's host-specific, not something this file can hardcode)
    # and set it as RENDER_GID, e.g. `RENDER_GID=108 docker compose up -d`.
    # Note that `privileged: true` is NOT a substitute: a non-root process
    # gets no effective capabilities from it, so CAP_DAC_OVERRIDE never
    # applies and the open still fails.
    # group_add:
    #   - "${RENDER_GID:-108}"
    # Two more things that commonly go wrong once the device is mapped, both
    # reported by the widget's hardware-acceleration diagnostics (Widget ->
    # Edit playback settings -> Run diagnostics):
    #   * The render node isn't always renderD128. A second DRM device (a
    #     discrete GPU, or a simpledrm/vkms node) shifts the iGPU to
    #     renderD129; set the widget's "Render device" setting to match.
    #   * Some Intel setups need the driver named explicitly. If vainfo
    #     reports no driver, add LIBVA_DRIVER_NAME=iHD (Intel Gen8+),
    #     i965 (older Intel) or radeonsi (AMD) to the environment above.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/andyg-0/tilora-frontend:${TILORA_VERSION:-latest}
    environment:
      # Read at request time, not baked into the image — must be an address
      # the *browser* can reach the backend at. Defaults to localhost, which
      # is correct only when the browser and both containers share a host
      # (e.g. the kiosk Pi itself). For any other topology (frontend and
      # backend on different hosts, a custom port, ...) override this —
      # no rebuild needed, just restart the container.
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Opt-in, recommended way to power the Container widget's Docker mode.
  # This does NOT make the socket readable without root — this proxy still
  # needs read access to the real socket, same as a direct mount would.
  # What changes is *scope*: instead of the whole backend (arbitrary
  # plugin/AI-tool code, reachable from the LAN) holding that access, only
  # this small, single-purpose proxy does — and CONTAINERS=1 + POST=0
  # locks even it down to read-only /containers/json, blocking
  # start/stop/exec regardless of what any client asks for.
  #
  # How that access is obtained differs by engine:
  #   - Docker, or *rootful* Podman where this whole compose project itself
  #     runs as root (e.g. `sudo docker/podman compose up`): the socket is
  #     root-owned, and the proxy's default `USER root` is enough — Docker
  #     has a persistent rootful daemon that does the actual mount setup
  #     for you either way, so this works even if `docker compose` itself
  #     is invoked as a non-root user.
  #   - Rootless Podman (no sudo, no root daemon at all — e.g. a regular
  #     user's own `podman-compose up`): there's no privileged daemon
  #     doing the mount setup on your behalf — the `podman` process
  #     preparing this container's bind mount runs *as that same
  #     unprivileged user*, so it can only mount sockets that user can
  #     already read. `/var/run/docker.sock` is commonly a symlink to
  #     *rootful* Podman's socket (root-owned) even on a host that also
  #     runs rootless Podman for your login user — mounting that here will
  #     fail with a permission error at container-creation time, not
  #     inside the container. Point CONTAINER_SOCKET_PATH (below) at your
  #     own rootless socket instead
  #     ($XDG_RUNTIME_DIR/podman/podman.sock, typically
  #     /run/user/<uid>/podman/podman.sock — enable it once with
  #     `systemctl --user enable --now podman.socket`, and
  #     `loginctl enable-linger <user>` so it survives logout/reboot on a
  #     headless server) — that socket is owned by your user, so no root
  #     is needed anywhere in the chain. Its blast radius is smaller than
  #     the rootful case too: it only controls *that user's own* rootless
  #     containers, not the whole host.
  #
  # No `ports:` published here — Compose's built-in per-project DNS
  # already resolves other services by name on its default network, so
  # the backend reaches this at plain `socket-proxy:2375` without any
  # host/LAN exposure. Set the widget's settings to connection: tcp,
  # host: socket-proxy, port: 2375 (see backend/config/dashboard.example.yaml)
  # — no other network wiring needed; the widget also degrades gracefully
  # and retries every 30s if this service isn't up yet.
  # socket-proxy:
  #   image: ghcr.io/tecnativa/docker-socket-proxy:latest
  #   environment:
  #     - CONTAINERS=1
  #     - POST=0
  #   volumes:
  #     - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
  #   restart: unless-stopped

volumes:
  backend-storage:
