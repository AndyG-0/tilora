name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Tilora version
      description: Contents of `VERSION`, or the version shown in Settings / `tilora status`.
      placeholder: "0.15.4"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Native (install.sh / systemd)
        - Docker Compose
    validations:
      required: true

  - type: input
    id: plugins
    attributes:
      label: Plugin(s) affected
      description: e.g. Weather, Jellyfin, Calendar — leave blank if not plugin-specific.

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Backend logs (`journalctl -u tilora-backend` / `docker compose logs backend`) or browser console output, if applicable.
      render: shell
