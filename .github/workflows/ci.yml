name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck deploy/*.sh dev.sh scripts/*.sh backend/docker-entrypoint.sh
      - name: Run installer test suite
        run: bash deploy/test-install.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # playwright.config.ts boots a real backend (uv run uvicorn) for the
      # e2e suite below, so this job needs uv too, not just node.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
      - run: uv sync
        working-directory: backend
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  docker-build:
    # Builds (does not push) both images on every push/PR, so a broken
    # Dockerfile/build-arg wiring fails here instead of only surfacing at
    # the next tagged release (see publish-images.yml, which does push).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: tilora-backend
            context: .
            dockerfile: backend/Dockerfile
          - image: tilora-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
