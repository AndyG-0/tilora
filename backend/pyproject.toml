[project]
name = "tilora-backend"
version = "0.14.1"
description = "Tilora dashboard backend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "asyncssh>=2.21.1",
    "caldav>=3.2.1",
    "cryptography>=42.0.0",
    "fastapi>=0.139.2",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "icloudpy>=0.9.0",
    "litellm>=1.93.0",
    "mcp>=1.28.1",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "speedtest-cli>=2.1.3",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "ruff>=0.16.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
