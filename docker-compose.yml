services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/storage.db
      # Without this, icloudpy's trusted-session cookies default to
      # /app/icloud_session (see backend/app/config.py), which isn't backed
      # by any volume above — every container recreation would force a
      # fresh 2FA prompt for the private iCloud Photos provider. Routing it
      # into the same volume as the DB fixes that, matching DB_PATH.
      - ICLOUD_SESSION_DIR=/app/data/icloud_session
      # Must match wherever the *browser* actually loads the frontend from —
      # this compose file serves it on port 3000, not the backend's own
      # 5173 default (that's the local Vite dev server's port). Overriding
      # here (rather than relying on backend/.env) means it's always correct
      # for this deployment out of the box; override again if
      # PUBLIC_API_BASE_URL below is also pointed at a non-default host.
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      # A directory mount (not a single-file mount on dashboard.yaml) —
      # ./backend/config is tracked in git and always exists, so a missing
      # dashboard.yaml on the host just becomes a normal missing file inside
      # an always-present directory, instead of Docker silently creating an
      # empty directory at the mount point (see docker-entrypoint.sh, which
      # copies the example file into place when that happens).
      - ./backend/config:/app/config
      - ./backend/.env:/app/.env
      - backend-storage:/app/data
      # Uncomment to enable the Docker widget (backend/app/plugins/docker) —
      # exposes the host's Docker socket to the container.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # Uncomment to enable the Podman widget (backend/app/plugins/podman) —
      # path shown is rootful Podman's default; rootless is
      # $XDG_RUNTIME_DIR/podman/podman.sock (commonly
      # /run/user/<uid>/podman/podman.sock).
      # - /run/podman/podman.sock:/run/podman/podman.sock:ro
      # Uncomment and point at a folder of images on the host to back the
      # Photos widget's "local" provider — set that same container-side path
      # as the widget's `directory` setting.
      # - /path/to/photos:/app/photos:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      # Read at request time (not baked into the image) — must be an address
      # the *browser* can reach the backend at, e.g. the Pi's LAN IP; see the
      # note in frontend/Dockerfile. Override in a .env file next to this
      # compose file, or with `PUBLIC_API_BASE_URL=... docker compose up`.
      # Changing this only needs a container restart, not a rebuild.
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend-storage:
