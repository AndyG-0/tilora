# Minimal dashboard used only by the Playwright e2e suite (see
# frontend/playwright.config.ts / e2e/global-setup.ts) — three lightweight,
# network-free widgets at distinct grid positions so a test can swap-drag
# clock<->date, resize message, and delete message, then verify each
# persisted via a reload.
widgets:
  - id: clock
    type: clock
    enabled: true
    layout: { col: 1, row: 1, colSpan: 1, rowSpan: 1 }
    settings:
      style: digital

  - id: date
    type: date
    enabled: true
    layout: { col: 2, row: 1, colSpan: 1, rowSpan: 1 }
    settings: {}

  - id: message
    type: message
    enabled: true
    layout: { col: 1, row: 2, colSpan: 2, rowSpan: 1 }
    settings:
      title: 'E2E'
      text: 'fixture widget'
